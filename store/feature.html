<!doctype html>
<!-- Play feature graphic 1024x500. ?lang=en switches the copy. -->
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1024px;height:500px;overflow:hidden;font-family:system-ui,'Segoe UI',Roboto,sans-serif}
  .bg{position:absolute;inset:0;background:#EEF0FA}
  .b{position:absolute;border-radius:50%;filter:blur(60px);opacity:.9}
  .b1{width:520px;height:520px;left:-120px;top:-160px;background:#A08BFF}
  .b2{width:460px;height:460px;right:-80px;top:-40px;background:#FFAE8C}
  .b3{width:520px;height:520px;left:300px;top:260px;background:#7FD9C0}
  .copy{position:absolute;left:72px;top:118px;width:470px}
  .logo{width:84px;height:84px;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(61,99,230,.35)}
  h1{margin:26px 0 10px;font-size:68px;letter-spacing:-.03em;color:#14161A}
  p{margin:0;font-size:27px;line-height:1.3;color:#3A3F4C}
  .card{position:absolute;right:76px;top:70px;width:340px;padding:26px;border-radius:30px;background:rgba(255,255,255,.42);
    border:1px solid rgba(255,255,255,.8);backdrop-filter:blur(20px);box-shadow:0 20px 50px rgba(60,70,130,.18)}
  .lbl{color:#5F6678;font-size:17px}.val{font-size:44px;font-weight:700;margin:4px 0 16px;color:#14161A}
  .chip{display:inline-block;padding:6px 14px;border-radius:99px;background:rgba(30,158,90,.16);color:#1E9E5A;font-weight:700;font-size:17px}
  svg.chart{display:block;margin-top:22px}
</style></head>
<body>
<div class="bg"><i class="b b1"></i><i class="b b2"></i><i class="b b3"></i></div>
<div class="copy">
  <div class="logo"><svg width="84" height="84" viewBox="18 18 72 72"><rect x="18" y="18" width="72" height="72" fill="#4F7CFF"/><path fill="#fff" d="M36,64h8v10h-8z M50,52h8v22h-8z M64,40h8v34h-8z"/><path fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" d="M34,46 L48,36 L58,42 L74,30"/></svg></div>
  <h1 id="t">Монетка</h1>
  <p id="s">Личный бюджет без облака, аккаунтов и рекламы</p>
</div>
<div class="card">
  <div class="lbl" id="l">Остаток на конец месяца</div>
  <div class="val">140 968 ₽</div>
  <span class="chip" id="c">+20 809 ₽ · +17%</span>
  <svg class="chart" width="288" height="110" viewBox="0 0 288 110">
    <g fill="#1E9E5A" opacity=".85"><rect x="14" y="30" width="16" height="80" rx="4"/><rect x="62" y="34" width="16" height="76" rx="4"/><rect x="110" y="26" width="16" height="84" rx="4"/><rect x="158" y="14" width="16" height="96" rx="4"/><rect x="206" y="22" width="16" height="88" rx="4"/><rect x="254" y="28" width="16" height="82" rx="4"/></g>
    <g fill="rgba(90,100,140,.35)"><rect x="33" y="52" width="16" height="58" rx="4"/><rect x="81" y="60" width="16" height="50" rx="4"/><rect x="129" y="64" width="16" height="46" rx="4"/><rect x="177" y="58" width="16" height="52" rx="4"/><rect x="225" y="46" width="16" height="64" rx="4"/><rect x="273" y="62" width="14" height="48" rx="4"/></g>
    <path d="M31 88 L79 76 L127 64 L175 48 L223 40 L271 26" fill="none" stroke="#4F7CFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</div>
<script>
  if (new URLSearchParams(location.search).get('lang') === 'en') {
    t.textContent = 'Monetka';
    s.textContent = 'A personal budget with no cloud, no accounts and no ads';
    l.textContent = 'Balance at month end';
    document.querySelector('.val').textContent = '₽140,968';
    c.textContent = '+₽20,809 · +17%';
  }
</script>
</body></html>
