name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Релиз только с main основного репозитория: в форках и PR секретов нет, APK там идёт лишь в артефакт
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'beekamai/monetka' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Signing key
        if: env.PUBLISH == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set: a release signed with another key would not install over the previous one"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # Play rejects the GitHub key (debug certificate), so the AAB is signed with a separate upload key;
      # Play re-signs with its own app key, so Play and GitHub installs never update each other anyway
      - name: Play upload key
        if: env.PUBLISH == 'true'
        env:
          UPLOAD_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_BASE64" ]; then
            echo "::error::PLAY_UPLOAD_KEYSTORE_BASE64 is not set: Google Play would reject the bundle"
            exit 1
          fi
          printf '%s' "$UPLOAD_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Gradle build
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          # APK — для установки напрямую, подписан ключом GitHub-релизов
          cp app/build/outputs/apk/release/app-release.apk ../Monetka-${{ github.run_number }}.apk

      - name: Gradle bundle
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          UPLOAD_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            export ANDROID_KEYSTORE="$RUNNER_TEMP/upload.keystore" ANDROID_KEYSTORE_PASSWORD="$UPLOAD_PASSWORD" \
              ANDROID_KEY_ALIAS="$UPLOAD_ALIAS" ANDROID_KEY_PASSWORD="$UPLOAD_PASSWORD"
          fi
          ./gradlew bundleRelease --no-daemon
          # AAB — для загрузки в Google Play, подписан ключом загрузки
          cp app/build/outputs/bundle/release/app-release.aab ../Monetka-${{ github.run_number }}.aab

      - name: Remove signing keys
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/upload.keystore"

      - uses: actions/upload-artifact@v7
        with:
          name: Monetka-${{ github.run_number }}
          path: |
            Monetka-*.apk
            Monetka-*.aab

      - name: Release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Монетка 1.1.${{ github.run_number }}
          body_path: fastlane/metadata/android/ru-RU/changelogs/default.txt
          generate_release_notes: true
          make_latest: true
          files: |
            Monetka-*.apk
            Monetka-*.aab
